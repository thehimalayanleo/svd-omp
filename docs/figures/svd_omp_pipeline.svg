<svg xmlns="http://www.w3.org/2000/svg" width="680" height="352" viewBox="0 0 680 352" role="img"><title>How causal-metric SVD-OMP works</title><desc>Offline: calibration text gives input and output statistics, a weighted SVD gives the atoms. Online: score every atom on the token's input, keep the k largest, sum them.</desc><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.f{font-size:13px;fill:#2C2C2A;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-style:italic}
.arr{stroke:#888780;stroke-width:1.2;fill:none}.mk{stroke:#888780}.dash{stroke:#888780}
.bar-keep{fill:#EF9F27}.bar-drop{fill:#B4B2A9}
.c-gray,.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>text{fill:#444441}
.c-purple,.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>text{fill:#3C3489}
.c-teal,.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>text{fill:#085041}
.c-amber,.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>text{fill:#633806}
@media (prefers-color-scheme:dark){
.t,.th,.f{fill:#D3D1C7}.ts{fill:#B4B2A9}.arr,.mk,.dash{stroke:#B4B2A9}.bar-drop{fill:#5F5E5A}
.c-gray,.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray>text{fill:#F1EFE8}
.c-purple,.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>text{fill:#CECBF6}
.c-teal,.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>text{fill:#9FE1CB}
.c-amber,.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>text{fill:#FAC775}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="th" x="40" y="30">Once per weight matrix (offline, no training)</text><g class="c-gray"><rect x="40" y="62" width="150" height="56" rx="4" stroke-width="0.5"/><text class="th" x="115.0" y="85" text-anchor="middle">Calibration text</text><text class="ts" x="115.0" y="104" text-anchor="middle">about 4k tokens, no labels</text></g><g class="c-purple"><rect x="220" y="44" width="190" height="56" rx="4" stroke-width="0.5"/><text class="th" x="315.0" y="67" text-anchor="middle">Input statistics</text><text class="f" x="315.0" y="87" text-anchor="middle">G = E[φφ<tspan dy="-4.8" font-size="8.6">T</tspan><tspan dy="4.8">]</tspan></text></g><g class="c-purple"><rect x="220" y="112" width="190" height="56" rx="4" stroke-width="0.5"/><text class="th" x="315.0" y="135" text-anchor="middle">Output sensitivity</text><text class="f" x="315.0" y="155" text-anchor="middle">M = E[gg<tspan dy="-4.8" font-size="8.6">T</tspan><tspan dy="4.8">]</tspan></text></g><g class="c-purple"><rect x="440" y="78" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="540.0" y="101" text-anchor="middle">Weighted SVD</text><text class="f" x="540.0" y="121" text-anchor="middle">L<tspan dy="3.6" font-size="8.6">out</tspan><tspan dy="-8.4" font-size="8.6">T</tspan><tspan dy="4.8"> W L</tspan><tspan dy="3.6" font-size="8.6">in</tspan><tspan dy="-3.6"> = P S Q</tspan><tspan dy="-4.8" font-size="8.6">T</tspan></text></g><line class="arr" x1="190" y1="82" x2="218" y2="72" marker-end="url(#arrow)"/><line class="arr" x1="190" y1="98" x2="218" y2="140" marker-end="url(#arrow)"/><line class="arr" x1="410" y1="72" x2="438" y2="98" marker-end="url(#arrow)"/><line class="arr" x1="410" y1="140" x2="438" y2="114" marker-end="url(#arrow)"/><text class="ts" x="440" y="154">atoms that sum to W exactly</text><line class="dash" x1="40" y1="186" x2="640" y2="186" stroke-width="0.5" stroke-dasharray="4 4"/><text class="th" x="40" y="214">Every token (online)</text><g class="c-gray"><rect x="40" y="232" width="120" height="56" rx="4" stroke-width="0.5"/><text class="th" x="100.0" y="255" text-anchor="middle">Layer input</text><text class="f" x="100.0" y="275" text-anchor="middle">φ</text></g><g class="c-amber"><rect x="180" y="232" width="160" height="56" rx="4" stroke-width="0.5"/><text class="th" x="260.0" y="255" text-anchor="middle">Score every atom</text><text class="f" x="260.0" y="275" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">c</tspan><tspan dy="-3.6"> = s</tspan><tspan dy="3.6" font-size="8.6">c</tspan><tspan dy="-3.6"> read</tspan><tspan dy="3.6" font-size="8.6">c</tspan><tspan dy="-8.4" font-size="8.6">T</tspan><tspan dy="4.8"> φ</tspan></text></g><g class="c-amber"><rect x="360" y="232" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="425.0" y="255" text-anchor="middle">Keep top-k</text><text class="f" x="425.0" y="275" text-anchor="middle">largest |a<tspan dy="3.6" font-size="8.6">c</tspan><tspan dy="-3.6">|</tspan></text></g><g class="c-gray"><rect x="510" y="232" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="575.0" y="255" text-anchor="middle">Output</text><text class="f" x="575.0" y="275" text-anchor="middle">Σ<tspan dy="3.6" font-size="8.6">kept</tspan><tspan dy="-3.6"> a</tspan><tspan dy="3.6" font-size="8.6">c</tspan><tspan dy="-3.6"> write</tspan><tspan dy="3.6" font-size="8.6">c</tspan></text></g><line class="arr" x1="160" y1="260" x2="178" y2="260" marker-end="url(#arrow)"/><line class="arr" x1="340" y1="260" x2="358" y2="260" marker-end="url(#arrow)"/><line class="arr" x1="490" y1="260" x2="508" y2="260" marker-end="url(#arrow)"/><line class="arr" x1="540" y1="162" x2="300" y2="230" marker-end="url(#arrow)"/><text class="ts" x="40" y="318">Minimises ½ eᵀMe, where e is the change in the layer output: the second-order</text><text class="ts" x="40" y="336">change in the model's next-token KL. Top-k is the exact optimum for every token.</text></svg>
