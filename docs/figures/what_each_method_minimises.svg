<svg xmlns="http://www.w3.org/2000/svg" width="680" height="376" viewBox="0 0 680 376" role="img"><title>What each method minimises</title><desc>Four cards: the loss minimised by plain, whitened and causal-metric SVD-OMP, and VPD's training loss.</desc><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.f{font-size:13px;fill:#2C2C2A;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-style:italic}
.arr{stroke:#888780;stroke-width:1.2;fill:none}.mk{stroke:#888780}.dash{stroke:#888780}
.bar-keep{fill:#EF9F27}.bar-drop{fill:#B4B2A9}
.c-gray,.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>text{fill:#444441}
.c-purple,.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>text{fill:#3C3489}
.c-teal,.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>text{fill:#085041}
.c-amber,.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>text{fill:#633806}
@media (prefers-color-scheme:dark){
.t,.th,.f{fill:#D3D1C7}.ts{fill:#B4B2A9}.arr,.mk,.dash{stroke:#B4B2A9}.bar-drop{fill:#5F5E5A}
.c-gray,.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray>text{fill:#F1EFE8}
.c-purple,.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>text{fill:#CECBF6}
.c-teal,.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>text{fill:#9FE1CB}
.c-amber,.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>text{fill:#FAC775}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="th" x="40" y="30">What each method minimises</text><g class="c-purple"><rect x="40" y="46" width="295" height="136" rx="6" stroke-width="0.5"/><text class="th" x="54" y="70">plain SVD-OMP</text></g><text class="f" x="54" y="94" style="font-size:12px">weights: none</text><text class="f" x="54" y="124" style="font-size:15px">‖(W − Ŵ)φ‖²</text><text class="ts" x="54" y="168">this layer's output, every direction equal</text><g class="c-purple"><rect x="345" y="46" width="295" height="136" rx="6" stroke-width="0.5"/><text class="th" x="359" y="70">whitened SVD-OMP</text></g><text class="f" x="359" y="94" style="font-size:12px">weights: inputs, G = E[φφ<tspan dy="-4.8" font-size="8.6">T</tspan><tspan dy="4.8">]</tspan></text><text class="f" x="359" y="124" style="font-size:15px">E<tspan dy="4.5" font-size="10.8">φ</tspan><tspan dy="-4.5"> ‖(W − Ŵ)φ‖²</tspan></text><text class="ts" x="359" y="168">this layer's output, on the inputs it really sees</text><g class="c-purple"><rect x="40" y="196" width="295" height="136" rx="6" stroke-width="0.5"/><text class="th" x="54" y="220">causal-metric SVD-OMP</text></g><text class="f" x="54" y="244" style="font-size:12px">weights: inputs G and outputs M = E[gg<tspan dy="-4.8" font-size="8.6">T</tspan><tspan dy="4.8">]</tspan></text><text class="f" x="54" y="274" style="font-size:15px">E<tspan dy="4.5" font-size="10.8">φ</tspan><tspan dy="-4.5"> [e</tspan><tspan dy="-6.0" font-size="10.8">T</tspan><tspan dy="6.0"> M e] ≈ 2 ΔKL</tspan></text><text class="ts" x="54" y="318">the model's next-token prediction</text><g class="c-teal"><rect x="345" y="196" width="295" height="136" rx="6" stroke-width="0.5"/><text class="th" x="359" y="220">VPD (trained)</text></g><text class="f" x="359" y="244" style="font-size:12px">learned components and importance net</text><text class="f" x="359" y="274" style="font-size:15px">‖W − Σ<tspan dy="4.5" font-size="10.8">c</tspan><tspan dy="-4.5"> u</tspan><tspan dy="4.5" font-size="10.8">c</tspan><tspan dy="-4.5"> v</tspan><tspan dy="4.5" font-size="10.8">c</tspan><tspan dy="-10.5" font-size="10.8">T</tspan><tspan dy="6.0">‖²</tspan><tspan dy="4.5" font-size="10.8">F</tspan><tspan dy="-4.5"> + KL(f ‖ f</tspan><tspan dy="4.5" font-size="10.8">masked</tspan><tspan dy="-4.5">)</tspan></text><text class="f" x="359" y="294" style="font-size:15px">+ λ Σ<tspan dy="4.5" font-size="10.8">c</tspan><tspan dy="-4.5"> g</tspan><tspan dy="4.5" font-size="10.8">c</tspan><tspan dy="-10.5" font-size="10.8">p</tspan></text><text class="ts" x="359" y="318">masked model still matches; few pieces needed</text><text class="ts" x="40" y="360">SVD family: closed form, top-k exact per token. VPD: trained against random and adversarial masks.</text></svg>
