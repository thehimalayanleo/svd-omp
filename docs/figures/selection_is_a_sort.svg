<svg xmlns="http://www.w3.org/2000/svg" width="680" height="324" viewBox="0 0 680 324" role="img"><title>Selection is a sort</title><desc>Bar chart of twelve atom coefficients on one token; the three largest are kept and the error equals the sum of squares of the dropped ones.</desc><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.f{font-size:13px;fill:#2C2C2A;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-style:italic}
.arr{stroke:#888780;stroke-width:1.2;fill:none}.mk{stroke:#888780}.dash{stroke:#888780}
.bar-keep{fill:#EF9F27}.bar-drop{fill:#B4B2A9}
.c-gray,.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>text{fill:#444441}
.c-purple,.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>text{fill:#3C3489}
.c-teal,.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>text{fill:#085041}
.c-amber,.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>text{fill:#633806}
@media (prefers-color-scheme:dark){
.t,.th,.f{fill:#D3D1C7}.ts{fill:#B4B2A9}.arr,.mk,.dash{stroke:#B4B2A9}.bar-drop{fill:#5F5E5A}
.c-gray,.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray>text{fill:#F1EFE8}
.c-purple,.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>text{fill:#CECBF6}
.c-teal,.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>text{fill:#9FE1CB}
.c-amber,.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>text{fill:#FAC775}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="th" x="40" y="30">One token: keep the k = 3 largest coefficients</text><rect class="bar-drop" x="50" y="203.5" width="24" height="46.5" rx="2"/><text class="f" x="62.0" y="268" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">1</tspan></text><rect class="bar-keep" x="82" y="90.0" width="24" height="160.0" rx="2"/><text class="f" x="94.0" y="268" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">2</tspan></text><rect class="bar-drop" x="114" y="229.4" width="24" height="20.6" rx="2"/><text class="f" x="126.0" y="268" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">3</tspan></text><rect class="bar-keep" x="146" y="136.5" width="24" height="113.5" rx="2"/><text class="f" x="158.0" y="268" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">4</tspan></text><rect class="bar-drop" x="178" y="234.5" width="24" height="15.5" rx="2"/><text class="f" x="190.0" y="268" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">5</tspan></text><rect class="bar-drop" x="210" y="177.7" width="24" height="72.3" rx="2"/><text class="f" x="222.0" y="268" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">6</tspan></text><rect class="bar-drop" x="242" y="239.7" width="24" height="10.3" rx="2"/><text class="f" x="254.0" y="268" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">7</tspan></text><rect class="bar-keep" x="274" y="105.5" width="24" height="144.5" rx="2"/><text class="f" x="286.0" y="268" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">8</tspan></text><rect class="bar-drop" x="306" y="219.0" width="24" height="31.0" rx="2"/><text class="f" x="318.0" y="268" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">9</tspan></text><rect class="bar-drop" x="338" y="237.1" width="24" height="12.9" rx="2"/><text class="f" x="350.0" y="268" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">10</tspan></text><rect class="bar-drop" x="370" y="198.4" width="24" height="51.6" rx="2"/><text class="f" x="382.0" y="268" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">11</tspan></text><rect class="bar-drop" x="402" y="224.2" width="24" height="25.8" rx="2"/><text class="f" x="414.0" y="268" text-anchor="middle">a<tspan dy="3.6" font-size="8.6">12</tspan></text><line class="dash" x1="44" y1="250" x2="434" y2="250" stroke-width="0.8"/><text class="ts" x="44" y="66">|a<tspan dy="3.6" font-size="8.6">c</tspan><tspan dy="-3.6">| on this token, atoms in their fixed order</tspan></text><rect class="bar-keep" x="450" y="96" width="14" height="14" rx="2"/><text class="ts" x="472" y="107">kept: the 3 largest</text><rect class="bar-drop" x="450" y="122" width="14" height="14" rx="2"/><text class="ts" x="472" y="133">dropped: everything else</text><text class="ts" x="450" y="168">Error left = sum of the</text><text class="ts" x="450" y="186">dropped bars, squared.</text><text class="ts" x="450" y="214">No other 3 atoms, and no</text><text class="ts" x="450" y="232">re-weighting of the kept ones,</text><text class="ts" x="450" y="250">can do better (Lean-checked).</text><text class="f" x="40" y="306">a<tspan dy="3.9" font-size="9.4">c</tspan><tspan dy="-3.9">(φ) = s</tspan><tspan dy="3.9" font-size="9.4">c</tspan><tspan dy="-3.9"> · read</tspan><tspan dy="3.9" font-size="9.4">c</tspan><tspan dy="-9.1" font-size="9.4">T</tspan><tspan dy="5.2"> φ</tspan></text><text class="f" x="300" y="306">error(S) = Σ<tspan dy="3.9" font-size="9.4">c ∉ S</tspan><tspan dy="-3.9"> a</tspan><tspan dy="3.9" font-size="9.4">c</tspan><tspan dy="-3.9">²</tspan></text></svg>
