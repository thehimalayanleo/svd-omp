<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img"><title>Two ways to split a weight matrix</title><desc>SVD-OMP splits W exactly into fixed orthogonal SVD atoms; VPD splits W approximately into learned components plus a leftover. On each token only k pieces are kept.</desc><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.2;fill:none}.mk{stroke:#888780}.dash{stroke:#888780}
.c-gray,.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>text{fill:#444441}
.c-purple,.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>text{fill:#3C3489}
.c-teal,.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>text{fill:#085041}
.c-amber,.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>text{fill:#633806}
.c-coral,.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>text{fill:#712B13}
@media (prefers-color-scheme:dark){
.t,.th{fill:#D3D1C7}.ts{fill:#B4B2A9}.arr,.mk,.dash{stroke:#B4B2A9}
.c-gray,.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray>text{fill:#F1EFE8}
.c-purple,.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>text{fill:#CECBF6}
.c-teal,.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>text{fill:#9FE1CB}
.c-amber,.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>text{fill:#FAC775}
.c-coral,.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral>text{fill:#F5C4B3}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="th" x="40" y="34">SVD-OMP: split W with the SVD</text><g class="c-gray"><rect x="40" y="48" width="80" height="80" rx="4" stroke-width="0.5"/><text class="th" x="80" y="93" text-anchor="middle">W</text></g><text class="t" x="142" y="93" text-anchor="middle">=</text><rect class="c-amber" x="165" y="66" width="44" height="44" rx="4" stroke-width="1" opacity="1"/><text class="ts" x="187" y="128" text-anchor="middle">σ1</text><rect class="c-purple" x="217" y="66" width="44" height="44" rx="4" stroke-width="0.5" opacity="0.9"/><text class="ts" x="239" y="128" text-anchor="middle">σ2</text><rect class="c-amber" x="269" y="66" width="44" height="44" rx="4" stroke-width="1" opacity="1"/><text class="ts" x="291" y="128" text-anchor="middle">σ3</text><rect class="c-purple" x="321" y="66" width="44" height="44" rx="4" stroke-width="0.5" opacity="0.75"/><text class="ts" x="343" y="128" text-anchor="middle">σ4</text><rect class="c-purple" x="373" y="66" width="44" height="44" rx="4" stroke-width="0.5" opacity="0.65"/><text class="ts" x="395" y="128" text-anchor="middle">σ5</text><rect class="c-amber" x="425" y="66" width="44" height="44" rx="4" stroke-width="1" opacity="1"/><text class="ts" x="447" y="128" text-anchor="middle">σ6</text><rect class="c-purple" x="477" y="66" width="44" height="44" rx="4" stroke-width="0.5" opacity="0.45"/><text class="ts" x="499" y="128" text-anchor="middle">σ7</text><rect class="c-purple" x="529" y="66" width="44" height="44" rx="4" stroke-width="0.5" opacity="0.35"/><text class="ts" x="551" y="128" text-anchor="middle">σ8</text><text class="t" x="596" y="93" text-anchor="middle">…</text><text class="ts" x="165" y="152">768 atoms at right angles, fixed by linear algebra, exact sum</text><text class="th" x="40" y="196">VPD: split W into learned components</text><g class="c-gray"><rect x="40" y="210" width="80" height="80" rx="4" stroke-width="0.5"/><text class="th" x="80" y="255" text-anchor="middle">W</text></g><text class="t" x="142" y="255" text-anchor="middle">≈</text><rect class="c-teal" x="165" y="232" width="36" height="36" rx="4" stroke-width="0.5"/><rect class="c-amber" x="207" y="232" width="36" height="36" rx="4" stroke-width="1"/><rect class="c-teal" x="249" y="232" width="36" height="36" rx="4" stroke-width="0.5"/><rect class="c-teal" x="291" y="232" width="36" height="36" rx="4" stroke-width="0.5"/><rect class="c-amber" x="333" y="232" width="36" height="36" rx="4" stroke-width="1"/><rect class="c-teal" x="375" y="232" width="36" height="36" rx="4" stroke-width="0.5"/><rect class="c-teal" x="417" y="232" width="36" height="36" rx="4" stroke-width="0.5"/><rect class="c-teal" x="459" y="232" width="36" height="36" rx="4" stroke-width="0.5"/><rect class="c-amber" x="501" y="232" width="36" height="36" rx="4" stroke-width="1"/><rect class="c-teal" x="543" y="232" width="36" height="36" rx="4" stroke-width="0.5"/><rect class="dash" x="595" y="232" width="36" height="36" rx="4" fill="none" stroke-width="0.8" stroke-dasharray="3 3"/><text class="t" x="613" y="255" text-anchor="middle">Δ</text><text class="ts" x="165" y="300">3,072 learned pieces (more than the rank) plus a small leftover Δ</text><rect class="c-amber" x="165" y="318" width="14" height="14" rx="3" stroke-width="1"/><text class="ts" x="186" y="329">kept on this token (the k pieces); everything else is switched off</text></svg>
