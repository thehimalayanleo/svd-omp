<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img"><title>How VPD is trained</title><desc>A token feeds learned components and a causal-importance network; low-importance pieces are masked randomly or adversarially; the masked model is compared with the real model; three losses train both.</desc><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.2;fill:none}.mk{stroke:#888780}.dash{stroke:#888780}
.c-gray,.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>text{fill:#444441}
.c-purple,.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>text{fill:#3C3489}
.c-teal,.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>text{fill:#085041}
.c-amber,.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>text{fill:#633806}
.c-coral,.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>text{fill:#712B13}
@media (prefers-color-scheme:dark){
.t,.th{fill:#D3D1C7}.ts{fill:#B4B2A9}.arr,.mk,.dash{stroke:#B4B2A9}
.c-gray,.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray>text{fill:#F1EFE8}
.c-purple,.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>text{fill:#CECBF6}
.c-teal,.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>text{fill:#9FE1CB}
.c-amber,.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>text{fill:#FAC775}
.c-coral,.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral>text{fill:#F5C4B3}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-gray"><rect x="260" y="30" width="160" height="44" rx="4" stroke-width="0.5"/><text class="th" x="340.0" y="57.0" text-anchor="middle">Token input</text></g><g class="c-teal"><rect x="110" y="116" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="210.0" y="139" text-anchor="middle">Components</text><text class="ts" x="210.0" y="158" text-anchor="middle">3,072 learned pieces</text></g><g class="c-purple"><rect x="370" y="116" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="470.0" y="139" text-anchor="middle">Causal importance net</text><text class="ts" x="470.0" y="158" text-anchor="middle">scores each piece 0 to 1</text></g><g class="c-gray"><rect x="230" y="216" width="220" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340.0" y="239" text-anchor="middle">Masked forward pass</text><text class="ts" x="340.0" y="258" text-anchor="middle">random or adversarial masks</text></g><g class="c-gray"><rect x="230" y="316" width="220" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340.0" y="339" text-anchor="middle">Compare with real model</text><text class="ts" x="340.0" y="358" text-anchor="middle">KL on next-token output</text></g><g class="c-coral"><rect x="50" y="410" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="140.0" y="433" text-anchor="middle">Faithful</text><text class="ts" x="140.0" y="452" text-anchor="middle">pieces add up to W</text></g><g class="c-coral"><rect x="250" y="410" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340.0" y="433" text-anchor="middle">Robust to masks</text><text class="ts" x="340.0" y="452" text-anchor="middle">masked output matches</text></g><g class="c-coral"><rect x="450" y="410" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="540.0" y="433" text-anchor="middle">Sparse</text><text class="ts" x="540.0" y="452" text-anchor="middle">few pieces matter</text></g><line class="arr" x1="310" y1="74" x2="240" y2="114" marker-end="url(#arrow)"/><line class="arr" x1="370" y1="74" x2="440" y2="114" marker-end="url(#arrow)"/><line class="arr" x1="230" y1="172" x2="290" y2="214" marker-end="url(#arrow)"/><line class="arr" x1="450" y1="172" x2="390" y2="214" marker-end="url(#arrow)"/><line class="arr" x1="340" y1="272" x2="340" y2="314" marker-end="url(#arrow)"/><line class="arr" x1="300" y1="372" x2="170" y2="408" marker-end="url(#arrow)"/><line class="arr" x1="340" y1="372" x2="340" y2="408" marker-end="url(#arrow)"/><line class="arr" x1="380" y1="372" x2="510" y2="408" marker-end="url(#arrow)"/><path d="M50 438 L28 438 L28 144 L108 144" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M630 438 L652 438 L652 144 L572 144" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/></svg>
