    <text x="815" y="630" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">10</text>
    <text x="883" y="619" text-anchor="middle" font-size="18" font-weight="700" fill="#667085">11</text>
    <text x="781" y="786" text-anchor="middle" font-size="20" font-weight="700" fill="#344054">Seed 317</text>

    <rect x="1082" y="476" width="368" height="284" rx="22" fill="#f9fafb" stroke="#e4e7ec" stroke-width="2"/>
    <text x="1120" y="522" font-size="19" font-weight="700" fill="#101828">Selectors</text>
    <rect x="1120" y="548" width="22" height="22" rx="5" fill="#2563eb"/>
    <text x="1156" y="566" font-size="18" fill="#344054">FoBa behavioral search</text>
    <rect x="1120" y="588" width="22" height="22" rx="5" fill="#f59e0b"/>
    <text x="1156" y="606" font-size="18" fill="#344054">Activation energy</text>
    <rect x="1120" y="628" width="22" height="22" rx="5" fill="#7c3aed"/>
    <text x="1156" y="646" font-size="18" fill="#344054">Contrastive gradient</text>
    <rect x="1120" y="668" width="22" height="22" rx="5" fill="#98a2b3"/>
    <text x="1156" y="686" font-size="18" fill="#344054">Best of 19 random supports</text>
    <line x1="1120" y1="714" x2="1412" y2="714" stroke="#d0d5dd"/>
    <text x="1120" y="741" font-size="17" font-weight="600" fill="#b42318">Frozen gate: failed on both seeds</text>
  </g>

  <rect x="104" y="818" width="1392" height="1" fill="#e4e7ec"/>
  <text x="104" y="844" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#475467">Conclusion: causal repair occurred, but FoBa did not robustly beat simple selectors. Seed 331 and the sealed split stayed unopened.</text>
</svg>
