<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matched causal layer-selection audit</title>
  <desc id="desc">All selectors use the same static rank-2 SVD intervention. FoBa ties or loses to simple baselines across two development seeds.</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="56" y="42" width="1488" height="816" rx="28" fill="#ffffff" stroke="#dbe3ef" stroke-width="2"/>

  <text x="104" y="112" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700" fill="#101828">Does FoBa find better causal layers?</text>
  <text x="104" y="154" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#475467">Hold the intervention fixed. Change only the layer selector.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="104" y="205" width="230" height="112" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="219" y="247" text-anchor="middle" font-size="17" font-weight="600" fill="#3730a3">POST-TRAINING DELTA</text>
    <text x="219" y="282" text-anchor="middle" font-size="27" font-weight="700" fill="#111827">ΔW = Wpost − Wbase</text>

    <path d="M342 261 H390" stroke="#98a2b3" stroke-width="4" stroke-linecap="round"/>
    <path d="M380 252 L392 261 L380 270" fill="none" stroke="#98a2b3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="398" y="205" width="230" height="112" rx="18" fill="#eff8ff" stroke="#b2ddff" stroke-width="2"/>
    <text x="513" y="247" text-anchor="middle" font-size="17" font-weight="600" fill="#175cd3">DECOMPOSE EACH LAYER</text>
    <text x="513" y="282" text-anchor="middle" font-size="27" font-weight="700" fill="#111827">16 SVD atoms</text>

    <path d="M636 261 H684" stroke="#98a2b3" stroke-width="4" stroke-linecap="round"/>
    <path d="M674 252 L686 261 L674 270" fill="none" stroke="#98a2b3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="692" y="190" width="260" height="142" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="4"/>
    <text x="822" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="#c2410c">ONLY VARIABLE</text>
    <text x="822" y="263" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">Choose layers</text>
    <text x="822" y="296" text-anchor="middle" font-size="16" fill="#475467">FoBa · Energy</text>
    <text x="822" y="319" text-anchor="middle" font-size="16" fill="#475467">Gradient · Random</text>

    <path d="M960 261 H1008" stroke="#98a2b3" stroke-width="4" stroke-linecap="round"/>
    <path d="M998 252 L1010 261 L998 270" fill="none" stroke="#98a2b3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1016" y="205" width="230" height="112" rx="18" fill="#ecfdf3" stroke="#abefc6" stroke-width="2"/>
    <text x="1131" y="247" text-anchor="middle" font-size="17" font-weight="600" fill="#067647">FIXED INTERVENTION</text>
    <text x="1131" y="282" text-anchor="middle" font-size="27" font-weight="700" fill="#111827">Static SVD, k = 2</text>

    <path d="M1254 261 H1302" stroke="#98a2b3" stroke-width="4" stroke-linecap="round"/>
    <path d="M1292 252 L1304 261 L1292 270" fill="none" stroke="#98a2b3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1310" y="205" width="190" height="112" rx="18" fill="#f9fafb" stroke="#d0d5dd" stroke-width="2"/>
    <text x="1405" y="247" text-anchor="middle" font-size="17" font-weight="600" fill="#344054">CALIBRATE, THEN</text>
    <text x="1405" y="282" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">Validate once</text>
  </g>

  <line x1="104" y1="377" x2="1496" y2="377" stroke="#e4e7ec" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
