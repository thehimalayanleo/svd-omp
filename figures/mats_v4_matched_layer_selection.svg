    <rect x="286" y="644" width="58" height="104" rx="8" fill="#f59e0b"/>
    <rect x="354" y="602" width="58" height="146" rx="8" fill="#7c3aed"/>
    <rect x="422" y="654" width="58" height="94" rx="8" fill="#98a2b3"/>
    <text x="247" y="588" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">14</text>
    <text x="315" y="630" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">10</text>
    <text x="383" y="588" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">14</text>
    <text x="451" y="640" text-anchor="middle" font-size="18" font-weight="700" fill="#667085">9</text>
    <text x="349" y="786" text-anchor="middle" font-size="20" font-weight="700" fill="#344054">Seed 313</text>

    <rect x="650" y="665" width="58" height="83" rx="8" fill="#2563eb"/>
    <rect x="718" y="644" width="58" height="104" rx="8" fill="#f59e0b"/>
