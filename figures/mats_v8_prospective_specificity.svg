<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f6f1"/>
      <stop offset="1" stop-color="#eef4f3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17342f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52756d"/>
    </marker>
    <style>
      .title { font: 700 44px Inter, system-ui, sans-serif; fill: #152a26; }
      .subtitle { font: 400 21px Inter, system-ui, sans-serif; fill: #527068; }
      .step { font: 700 20px Inter, system-ui, sans-serif; fill: #17342f; }
      .body { font: 400 17px Inter, system-ui, sans-serif; fill: #49635d; }
      .small { font: 600 15px Inter, system-ui, sans-serif; fill: #5f756f; letter-spacing: 0.4px; }
      .metric { font: 800 34px Inter, system-ui, sans-serif; fill: #14342d; }
      .seed { font: 700 23px Inter, system-ui, sans-serif; fill: #17342f; }
      .axis { font: 600 15px Inter, system-ui, sans-serif; fill: #60736e; }
    </style>
  </defs>
  <rect width="1500" height="900" fill="url(#bg)"/>
  <circle cx="1360" cy="110" r="180" fill="#d8eee8" opacity="0.55"/>
  <circle cx="80" cy="830" r="220" fill="#f3dfcc" opacity="0.55"/>

  <text x="90" y="85" class="title">Frozen SVD atoms causally repair one learned rule</text>
  <text x="90" y="123" class="subtitle">Prospective Qwen3-4B validation with source-paired controls and untouched test questions</text>

  <g filter="url(#shadow)">
    <rect x="90" y="170" width="285" height="175" rx="22" fill="#ffffff"/>
    <rect x="405" y="170" width="285" height="175" rx="22" fill="#ffffff"/>
    <rect x="720" y="170" width="285" height="175" rx="22" fill="#ffffff"/>
    <rect x="1035" y="170" width="375" height="175" rx="22" fill="#ffffff"/>
  </g>
  <line x1="375" y1="257" x2="397" y2="257" stroke="#52756d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="690" y1="257" x2="712" y2="257" stroke="#52756d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1005" y1="257" x2="1027" y2="257" stroke="#52756d" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="120" y="208" class="small">1  LEARNED REGRESSION</text>
  <text x="120" y="247" class="step">Warning triggers U</text>
  <text x="120" y="278" class="body">Clean question: answer</text>
  <text x="120" y="305" class="body">Same question + warning: abstain</text>

  <text x="435" y="208" class="small">2  DECOMPOSE UPDATE</text>
  <text x="435" y="247" class="step">Delta W = sum of atoms</text>
  <g transform="translate(438 273)">
    <rect x="0" y="0" width="38" height="38" rx="5" fill="#1d6d5b"/>
    <rect x="46" y="0" width="38" height="38" rx="5" fill="#65a894"/>
    <rect x="92" y="0" width="38" height="38" rx="5" fill="#b9d9cf"/>
    <text x="0" y="66" class="body">40 rank-one SVD atoms</text>
  </g>

  <text x="750" y="208" class="small">3  SELECT ON DEVELOPMENT</text>
  <text x="750" y="247" class="step">Paired gradient score</text>
  <text x="750" y="278" class="body">Help target</text>
  <text x="750" y="305" class="body">Penalize paired + other changes</text>

  <text x="1065" y="208" class="small">4  FREEZE, THEN OPEN TEST</text>
  <text x="1065" y="247" class="step">Subtract only 3 or 4 atoms</text>
  <text x="1065" y="278" class="body">24 globally unused source pairs</text>
  <text x="1065" y="305" class="body">20 matched random supports per seed</text>

  <g filter="url(#shadow)">
    <rect x="90" y="395" width="1320" height="365" rx="26" fill="#ffffff"/>
  </g>
  <text x="125" y="443" class="step">Specific repairs on the frozen final test</text>
  <text x="125" y="474" class="body">A repair counts only when the same source's genuine-abstention control stays correct.</text>

  <text x="130" y="537" class="seed">Seed 349</text>
  <text x="130" y="683" class="seed">Seed 353</text>
  <line x1="310" y1="502" x2="310" y2="718" stroke="#d9e3df" stroke-width="2"/>
  <line x1="520" y1="502" x2="520" y2="718" stroke="#e6ecea" stroke-width="1"/>
  <line x1="730" y1="502" x2="730" y2="718" stroke="#e6ecea" stroke-width="1"/>
  <line x1="940" y1="502" x2="940" y2="718" stroke="#e6ecea" stroke-width="1"/>
  <line x1="1150" y1="502" x2="1150" y2="718" stroke="#e6ecea" stroke-width="1"/>
  <line x1="1318" y1="502" x2="1318" y2="718" stroke="#d9e3df" stroke-width="2"/>
  <text x="303" y="738" class="axis">0</text>
  <text x="512" y="738" class="axis">5</text>
  <text x="718" y="738" class="axis">10</text>
  <text x="928" y="738" class="axis">15</text>
  <text x="1138" y="738" class="axis">20</text>
  <text x="1302" y="738" class="axis">24</text>

  <rect x="310" y="510" width="504" height="38" rx="9" fill="#176b58"/>
  <text x="826" y="537" class="metric">12</text>
  <text x="912" y="536" class="body">FoBa 12  •  Energy 12  •  Best random 11</text>
  <rect x="310" y="655" width="798" height="38" rx="9" fill="#176b58"/>
  <text x="1120" y="683" class="metric">19</text>
  <text x="912" y="634" class="body">FoBa 17  •  Energy 12  •  Best random 0</text>

  <rect x="90" y="795" width="420" height="58" rx="16" fill="#daf0e8"/>
  <text x="120" y="831" class="step">0 shortcuts  •  0 paired damage</text>
  <rect x="540" y="795" width="420" height="58" rx="16" fill="#daf0e8"/>
  <text x="570" y="831" class="step">All protected families: 24/24</text>
  <rect x="990" y="795" width="420" height="58" rx="16" fill="#17342f"/>
  <text x="1020" y="831" style="font:700 20px Inter,system-ui,sans-serif;fill:#ffffff">Both preregistered gates pass  ✓</text>
  <text x="1145" y="882" text-anchor="middle" class="small">Claim: replicated specific repair over matched random, not universal selector superiority</text>
</svg>
