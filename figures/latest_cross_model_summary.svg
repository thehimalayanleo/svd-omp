<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="plot-title plot-desc">
<title id="plot-title">Cross-model fidelity and selector-cost summary</title>
<desc id="plot-desc">SVD-FoBa and CP-SVD error advantages over SWD, plus CP-SVD selector reduction relative to SVD-FoBa.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17212b}
.title{font-size:18px;font-weight:700}.subtitle{font-size:12px;fill:#536273}
.axis{stroke:#657586;stroke-width:1.2}.grid{stroke:#dfe5eb;stroke-width:1}
.tick{font-size:10px;fill:#657586}.value{font-size:13px;font-weight:700}
.model{font-size:10px}.annotation{font-size:10px;fill:#536273}
</style>
<rect width="1200" height="470" fill="#ffffff"/>
<text x="190" y="42" text-anchor="middle" class="title">SVD-FoBa fidelity</text>
<text x="190" y="66" text-anchor="middle" class="subtitle">SWD error / SVD-FoBa error, higher is better</text>
<line x1="40" y1="390" x2="345" y2="390" class="axis"/>
<line x1="40" y1="390.0" x2="345" y2="390.0" class="grid"/>
<text x="34" y="394.0" text-anchor="end" class="tick">0.0</text>
<line x1="40" y1="319.5" x2="345" y2="319.5" class="grid"/>
<text x="34" y="323.5" text-anchor="end" class="tick">0.6</text>
<line x1="40" y1="249.0" x2="345" y2="249.0" class="grid"/>
<text x="34" y="253.0" text-anchor="end" class="tick">1.2</text>
<line x1="40" y1="178.5" x2="345" y2="178.5" class="grid"/>
<text x="34" y="182.5" text-anchor="end" class="tick">1.9</text>
<line x1="40" y1="108.0" x2="345" y2="108.0" class="grid"/>
<text x="34" y="112.0" text-anchor="end" class="tick">2.5</text>
<rect x="53" y="203.7" width="72" height="186.3" rx="5" fill="#1f77b4"/>
<text x="89.0" y="194.7" text-anchor="middle" class="value">1.65×</text>
<text x="89.0" y="412" text-anchor="middle" class="model">Goodfire 67M</text>
<rect x="157" y="143.4" width="72" height="246.6" rx="5" fill="#2ca02c"/>
<text x="193.0" y="134.4" text-anchor="middle" class="value">2.19×</text>
<text x="193.0" y="412" text-anchor="middle" class="model">Pythia-70M</text>
<rect x="261" y="134.2" width="72" height="255.8" rx="5" fill="#9467bd"/>
<text x="297.0" y="125.2" text-anchor="middle" class="value">2.27×</text>
<text x="297.0" y="412" text-anchor="middle" class="model">OPT-125M</text>
<text x="595" y="42" text-anchor="middle" class="title">CP-SVD fidelity</text>
<text x="595" y="66" text-anchor="middle" class="subtitle">SWD error / CP-SVD error, higher is better</text>
<line x1="445" y1="390" x2="750" y2="390" class="axis"/>
<line x1="445" y1="390.0" x2="750" y2="390.0" class="grid"/>
<text x="439" y="394.0" text-anchor="end" class="tick">0.0</text>
<line x1="445" y1="319.5" x2="750" y2="319.5" class="grid"/>
<text x="439" y="323.5" text-anchor="end" class="tick">0.6</text>
<line x1="445" y1="249.0" x2="750" y2="249.0" class="grid"/>
<text x="439" y="253.0" text-anchor="end" class="tick">1.2</text>
<line x1="445" y1="178.5" x2="750" y2="178.5" class="grid"/>
<text x="439" y="182.5" text-anchor="end" class="tick">1.9</text>
<line x1="445" y1="108.0" x2="750" y2="108.0" class="grid"/>
<text x="439" y="112.0" text-anchor="end" class="tick">2.5</text>
<rect x="458" y="217.1" width="72" height="172.9" rx="5" fill="#1f77b4"/>
<text x="494.0" y="208.1" text-anchor="middle" class="value">1.53×</text>
<text x="494.0" y="412" text-anchor="middle" class="model">Goodfire 67M</text>
<text x="494.0" y="432" text-anchor="middle" class="annotation">240/240</text>
<rect x="562" y="164.8" width="72" height="225.2" rx="5" fill="#2ca02c"/>
<text x="598.0" y="155.8" text-anchor="middle" class="value">2.00×</text>
<text x="598.0" y="412" text-anchor="middle" class="model">Pythia-70M</text>
<text x="598.0" y="432" text-anchor="middle" class="annotation">240/240</text>
<rect x="666" y="151.6" width="72" height="238.4" rx="5" fill="#9467bd"/>
<text x="702.0" y="142.6" text-anchor="middle" class="value">2.11×</text>
<text x="702.0" y="412" text-anchor="middle" class="model">OPT-125M</text>
<text x="702.0" y="432" text-anchor="middle" class="annotation">239/240</text>
<text x="1000" y="42" text-anchor="middle" class="title">CP-SVD selector reduction</text>
<text x="1000" y="66" text-anchor="middle" class="subtitle">SVD-FoBa scored width / CP-SVD scored width</text>
<line x1="850" y1="390" x2="1155" y2="390" class="axis"/>
<line x1="850" y1="390.0" x2="1155" y2="390.0" class="grid"/>
<text x="844" y="394.0" text-anchor="end" class="tick">0.0</text>
<line x1="850" y1="319.5" x2="1155" y2="319.5" class="grid"/>
<text x="844" y="323.5" text-anchor="end" class="tick">2.5</text>
<line x1="850" y1="249.0" x2="1155" y2="249.0" class="grid"/>
<text x="844" y="253.0" text-anchor="end" class="tick">5.0</text>
<line x1="850" y1="178.5" x2="1155" y2="178.5" class="grid"/>
<text x="844" y="182.5" text-anchor="end" class="tick">7.5</text>
<line x1="850" y1="108.0" x2="1155" y2="108.0" class="grid"/>
<text x="844" y="112.0" text-anchor="end" class="tick">10.0</text>
<rect x="863" y="126.8" width="72" height="263.2" rx="5" fill="#1f77b4"/>
<text x="899.0" y="117.8" text-anchor="middle" class="value">9.33×</text>
<text x="899.0" y="412" text-anchor="middle" class="model">Goodfire 67M</text>
<rect x="967" y="202.0" width="72" height="188.0" rx="5" fill="#2ca02c"/>
<text x="1003.0" y="193.0" text-anchor="middle" class="value">6.67×</text>
<text x="1003.0" y="412" text-anchor="middle" class="model">Pythia-70M</text>
<rect x="1071" y="126.8" width="72" height="263.2" rx="5" fill="#9467bd"/>
<text x="1107.0" y="117.8" text-anchor="middle" class="value">9.33×</text>
<text x="1107.0" y="412" text-anchor="middle" class="model">OPT-125M</text>
<text x="600" y="452" text-anchor="middle" class="subtitle">Frozen WikiText-2 evaluations; 24 matrices and 10 selected-unit widths per model.</text>
</svg>
