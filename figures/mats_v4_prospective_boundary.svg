<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prospective sparse causal repair boundary</title>
  <desc id="desc">A post-training update is decomposed into SVD atoms. The same frozen rank-one intervention repairs almost all targets on the first prospective distribution but almost none on a second source-disjoint distribution, while protected behaviors remain accurate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121f"/>
      <stop offset="1" stop-color="#101d31"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65e6d4"/>
      <stop offset="1" stop-color="#5bb8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f829e"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1435" cy="90" r="210" fill="#183251" opacity="0.32"/>
  <circle cx="170" cy="825" r="250" fill="#123a42" opacity="0.22"/>

  <text x="90" y="88" fill="#f4f8ff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700">The intervention was causal, but not portable</text>
  <text x="90" y="130" fill="#aab9ce" font-family="Inter,Arial,sans-serif" font-size="23">Same Qwen3-4B organisms, same frozen SVD atoms, two untouched question distributions</text>

  <g filter="url(#shadow)">
    <rect x="90" y="200" width="400" height="250" rx="28" fill="#12243a" stroke="#284362" stroke-width="2"/>
    <text x="125" y="248" fill="#82a5c8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">POST-TRAINING CHANGE</text>
    <text x="125" y="304" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">ΔW = W<tspan baseline-shift="sub" font-size="20">post</tspan> − W<tspan baseline-shift="sub" font-size="20">base</tspan></text>
    <g transform="translate(125,340)">
      <rect x="0" y="0" width="54" height="54" rx="8" fill="#30577b"/>
      <rect x="66" y="0" width="54" height="54" rx="8" fill="#36a9a0"/>
      <rect x="132" y="0" width="54" height="54" rx="8" fill="#4e80bd"/>
      <text x="205" y="37" fill="#d7e3f3" font-family="Inter,Arial,sans-serif" font-size="24">= Σ σᵢuᵢvᵢᵀ</text>
    </g>
    <text x="125" y="424" fill="#aab9ce" font-family="Inter,Arial,sans-serif" font-size="18">Split the learned update into rank-one SVD atoms</text>
  </g>

  <line x1="510" y1="325" x2="610" y2="325" stroke="#6f829e" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="630" y="200" width="350" height="250" rx="28" fill="#12243a" stroke="#3c7592" stroke-width="2"/>
    <text x="665" y="248" fill="#82a5c8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">FROZEN INTERVENTION</text>
    <circle cx="805" cy="337" r="67" fill="none" stroke="url(#cyan)" stroke-width="10"/>
    <path d="M756 337 H854" stroke="#f4f8ff" stroke-width="10" stroke-linecap="round"/>
    <text x="665" y="424" fill="#d7e3f3" font-family="Inter,Arial,sans-serif" font-size="19">Subtract one selected atom during inference</text>
  </g>

  <line x1="1000" y1="325" x2="1090" y2="325" stroke="#6f829e" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1110" y="175" width="400" height="300" rx="28" fill="#0f2930" stroke="#38b9a8" stroke-width="2"/>
    <text x="1145" y="222" fill="#74dfd0" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">PROSPECTIVE SET 1</text>
    <text x="1145" y="274" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Strong selective repair</text>
    <text x="1145" y="339" fill="#65e6d4" font-family="Inter,Arial,sans-serif" font-size="53" font-weight="800">22/24  ·  23/24</text>
    <text x="1145" y="382" fill="#c6d7d5" font-family="Inter,Arial,sans-serif" font-size="19">newly correct targets across two seeds</text>
    <text x="1145" y="426" fill="#92c8bf" font-family="Inter,Arial,sans-serif" font-size="18">100 matched-random draws per seed beaten</text>
  </g>

  <path d="M805 470 V566 H1110" fill="none" stroke="#6f829e" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1110" y="520" width="400" height="260" rx="28" fill="#30211d" stroke="#e18a5b" stroke-width="2"/>
    <text x="1145" y="567" fill="#f0a77f" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">PROSPECTIVE SET 2</text>
    <text x="1145" y="619" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Effect disappears</text>
    <text x="1145" y="684" fill="#ff9d70" font-family="Inter,Arial,sans-serif" font-size="53" font-weight="800">2/24  ·  0/24</text>
    <text x="1145" y="727" fill="#e2c9bc" font-family="Inter,Arial,sans-serif" font-size="19">same frozen intervention, new sources</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="535" width="890" height="245" rx="28" fill="#111f32" stroke="#2a425e" stroke-width="2"/>
    <text x="125" y="582" fill="#82a5c8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">WHAT THE CONTROLS SAY</text>
    <circle cx="150" cy="638" r="15" fill="#65e6d4"/>
    <text x="182" y="647" fill="#edf5ff" font-family="Inter,Arial,sans-serif" font-size="22">The trained warning regression remained 24/24 on set 2</text>
    <circle cx="150" cy="692" r="15" fill="#65e6d4"/>
    <text x="182" y="701" fill="#edf5ff" font-family="Inter,Arial,sans-serif" font-size="22">Protected behavior stayed at least 22/24</text>
    <circle cx="150" cy="746" r="15" fill="#ff9d70"/>
    <text x="182" y="755" fill="#edf5ff" font-family="Inter,Arial,sans-serif" font-size="22">Therefore the sparse repair, not the organism, failed to travel</text>
  </g>

  <text x="90" y="850" fill="#cbd8e8" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">Causal claim: supported on one distribution. General sparse mechanism: not yet supported.</text>
</svg>
