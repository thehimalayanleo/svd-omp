<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Five-stage bounded sparse causal-repair audit</title>
  <desc id="desc">A Qwen3-4B sparse SVD repair succeeds on one distribution, fails on a second, transfers once after robust support selection, and then fails a matched selector comparison. An ambiguity control shows that activation energy suppresses valid abstention.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62e6c2"/>
      <stop offset="1" stop-color="#68bfff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000611" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#657b98"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1530" cy="20" r="260" fill="#19436a" opacity="0.22"/>
  <circle cx="40" cy="980" r="300" fill="#12443f" opacity="0.18"/>

  <text x="70" y="74" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="760">Bounded sparse repair survives. Selector wins do not.</text>
  <text x="70" y="113" fill="#a9bbcf" font-family="Inter,Arial,sans-serif" font-size="21">Each stage freezes a harder question before opening the next source-disjoint test.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="70" y="170" width="270" height="245" rx="24" fill="#12283a" stroke="#315572" stroke-width="2"/>
    <text x="98" y="207" fill="#8fb4d4" font-size="15" font-weight="700" letter-spacing="1.5">1  ROUTING ABLATION</text>
    <text x="98" y="251" fill="#ffffff" font-size="24" font-weight="700">OMP vs static</text>
    <text x="98" y="299" fill="#d2deea" font-size="18">OMP</text>
    <text x="300" y="299" text-anchor="end" fill="#d2deea" font-size="22" font-weight="700">14, 8</text>
    <text x="98" y="337" fill="#d2deea" font-size="18">Static SVD</text>
    <text x="300" y="337" text-anchor="end" fill="#65d8c4" font-size="22" font-weight="700">14, 11</text>
    <rect x="98" y="365" width="214" height="31" rx="9" fill="#173c42"/>
    <text x="205" y="387" text-anchor="middle" fill="#76dfcd" font-size="16" font-weight="700">OMP adds no value</text>

    <rect x="385" y="170" width="270" height="245" rx="24" fill="#122d34" stroke="#3b8c82" stroke-width="2"/>
    <text x="413" y="207" fill="#78d5c7" font-size="15" font-weight="700" letter-spacing="1.5">2  UNTOUCHED A</text>
    <text x="413" y="251" fill="#ffffff" font-size="24" font-weight="700">Fixed static SVD</text>
    <text x="413" y="319" fill="url(#good)" font-size="51" font-weight="800">45 / 48</text>
    <text x="413" y="351" fill="#c9dedb" font-size="17">repairs across two seeds</text>
    <rect x="413" y="365" width="214" height="31" rx="9" fill="#173c42"/>
    <text x="520" y="387" text-anchor="middle" fill="#76dfcd" font-size="16" font-weight="700">causal effect</text>

    <rect x="700" y="170" width="270" height="245" rx="24" fill="#34231f" stroke="#8d5945" stroke-width="2"/>
    <text x="728" y="207" fill="#eeae8d" font-size="15" font-weight="700" letter-spacing="1.5">3  UNTOUCHED B</text>
    <text x="728" y="251" fill="#ffffff" font-size="24" font-weight="700">Same fixed support</text>
    <text x="728" y="319" fill="#ff9c76" font-size="51" font-weight="800">2 / 48</text>
    <text x="728" y="351" fill="#dcc9c1" font-size="17">both organisms still valid</text>
    <rect x="728" y="365" width="214" height="31" rx="9" fill="#402720"/>
    <text x="835" y="387" text-anchor="middle" fill="#ffb18f" font-size="16" font-weight="700">generality fails</text>

    <rect x="1015" y="170" width="270" height="245" rx="24" fill="#122d34" stroke="#3b8c82" stroke-width="2"/>
    <text x="1043" y="207" fill="#78d5c7" font-size="15" font-weight="700" letter-spacing="1.5">4  UNTOUCHED C</text>
    <text x="1043" y="251" fill="#ffffff" font-size="24" font-weight="700">Robust support</text>
    <text x="1043" y="319" fill="url(#good)" font-size="51" font-weight="800">34 / 48</text>
    <text x="1043" y="351" fill="#c9dedb" font-size="17">static SVD repairs</text>
    <rect x="1043" y="365" width="214" height="31" rx="9" fill="#173c42"/>
    <text x="1150" y="387" text-anchor="middle" fill="#76dfcd" font-size="16" font-weight="700">transfers once</text>

    <rect x="1330" y="170" width="200" height="245" rx="24" fill="#34231f" stroke="#8d5945" stroke-width="2"/>
    <text x="1356" y="207" fill="#eeae8d" font-size="15" font-weight="700" letter-spacing="1.3">5  UNTOUCHED D</text>
    <text x="1356" y="251" fill="#ffffff" font-size="23" font-weight="700">Matched test</text>
    <text x="1356" y="303" fill="#d7c9c3" font-size="17">FoBa</text>
    <text x="1504" y="303" text-anchor="end" fill="#ff9c76" font-size="21" font-weight="700">9, 0</text>
    <text x="1356" y="339" fill="#d7c9c3" font-size="17">Random</text>
    <text x="1504" y="339" text-anchor="end" fill="#ffffff" font-size="21" font-weight="700">21, 0</text>
    <rect x="1356" y="365" width="148" height="31" rx="9" fill="#402720"/>
    <text x="1430" y="387" text-anchor="middle" fill="#ffb18f" font-size="15" font-weight="700">FoBa fails</text>
  </g>

  <g stroke="#657b98" stroke-width="3" marker-end="url(#arrow)">
    <line x1="345" y1="292" x2="376" y2="292"/>
    <line x1="660" y1="292" x2="691" y2="292"/>
    <line x1="975" y1="292" x2="1006" y2="292"/>
    <line x1="1290" y1="292" x2="1321" y2="292"/>
  </g>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="70" y="480" width="1460" height="390" rx="28" fill="#101f31" stroke="#2b4662" stroke-width="2"/>
    <text x="105" y="530" fill="#ffffff" font-size="29" font-weight="740">Why the obvious winner was not a repair</text>
    <text x="105" y="564" fill="#aebed0" font-size="18">Fourth-set seed results, shown as newly correct targets out of 24</text>

    <text x="120" y="627" fill="#c9d6e4" font-size="19">Robust FoBa</text>
    <rect x="310" y="605" width="270" height="31" rx="8" fill="#4ba89b"/>
    <text x="594" y="628" fill="#ffffff" font-size="18" font-weight="700">9</text>
    <circle cx="329" cy="662" r="5" fill="#4ba89b"/>
    <text x="594" y="669" fill="#ffffff" font-size="18" font-weight="700">0</text>

    <text x="120" y="735" fill="#c9d6e4" font-size="19">Best random</text>
    <rect x="310" y="713" width="630" height="31" rx="8" fill="#7590aa"/>
    <text x="954" y="736" fill="#ffffff" font-size="18" font-weight="700">21</text>
    <circle cx="329" cy="770" r="5" fill="#7590aa"/>
    <text x="954" y="777" fill="#ffffff" font-size="18" font-weight="700">0</text>

    <line x1="1015" y1="585" x2="1015" y2="826" stroke="#314b66" stroke-width="2"/>
    <text x="1060" y="625" fill="#ffffff" font-size="25" font-weight="700">Energy looks strongest</text>
    <text x="1060" y="673" fill="#65d8c4" font-size="43" font-weight="800">23, 12</text>
    <text x="1060" y="705" fill="#aebed0" font-size="17">target repairs across seeds</text>
    <line x1="1060" y1="738" x2="1460" y2="738" stroke="#4d3b3a" stroke-width="2"/>
    <text x="1060" y="778" fill="#ff9c76" font-size="22" font-weight="700">Warned ambiguity: 0, 0</text>
    <text x="1060" y="810" fill="#e2c3b6" font-size="17">It suppresses valid abstention.</text>

    <text x="120" y="845" fill="#8fa3ba" font-size="15">top row seed 313, bottom row seed 317</text>
  </g>

  <rect x="70" y="905" width="1460" height="58" rx="17" fill="#142839" stroke="#315875"/>
  <text x="800" y="942" text-anchor="middle" fill="#f4f8fc" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="650">Bounded causal repair is real. No general FoBa or OMP win. The specificity control catches shortcut repair.</text>
</svg>
