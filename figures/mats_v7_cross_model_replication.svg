<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Sparse causal repair across two behaviors and model families</title>
  <desc id="desc">Five prospective seeds show positive source-paired repair. The three Phi seeds beat all ninety-nine matched random supports, while one misses the frozen eight-repair gate by one.</desc>
  <rect width="1200" height="680" rx="32" fill="#0b1020"/>
  <text x="70" y="75" fill="#f7f5ef" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">One causal audit, two regressions, five prospective seeds</text>
  <text x="70" y="112" fill="#a8b3cf" font-family="Inter,Arial,sans-serif" font-size="19">A repair counts only when the target flips correctly and its same-source control stays correct.</text>

  <rect x="70" y="155" width="1060" height="105" rx="22" fill="#141d35" stroke="#2a385d"/>
  <text x="100" y="190" fill="#78dce8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">POST-TRAINING DELTA</text>
  <text x="100" y="225" fill="#f7f5ef" font-family="Inter,Arial,sans-serif" font-size="24">SVD atoms</text>
  <path d="M285 210 H390" stroke="#65749a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="420" y="225" fill="#f7f5ef" font-family="Inter,Arial,sans-serif" font-size="24">paired selection</text>
  <path d="M640 210 H745" stroke="#65749a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="775" y="225" fill="#f7f5ef" font-family="Inter,Arial,sans-serif" font-size="24">subtract 3 or 4 atoms</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65749a"/></marker></defs>

  <text x="70" y="318" fill="#f7f5ef" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Specific repairs on 24 unseen targets</text>
  <line x1="315" y1="345" x2="1080" y2="345" stroke="#26324f"/>
  <g font-family="Inter,Arial,sans-serif" font-size="17">
    <text x="70" y="390" fill="#d6dcf0">Qwen warning, seed 349</text><rect x="315" y="368" width="360" height="28" rx="8" fill="#7c5cff"/><text x="690" y="389" fill="#f7f5ef">12</text>
    <text x="70" y="445" fill="#d6dcf0">Qwen warning, seed 353</text><rect x="315" y="423" width="570" height="28" rx="8" fill="#7c5cff"/><text x="900" y="444" fill="#f7f5ef">19</text>
    <text x="70" y="500" fill="#d6dcf0">Phi marker, seed 401</text><rect x="315" y="478" width="600" height="28" rx="8" fill="#32d6a0"/><text x="930" y="499" fill="#f7f5ef">20</text>
    <text x="70" y="555" fill="#d6dcf0">Phi marker, seed 409</text><rect x="315" y="533" width="390" height="28" rx="8" fill="#32d6a0"/><text x="720" y="554" fill="#f7f5ef">13</text>
    <text x="70" y="610" fill="#d6dcf0">Phi marker, seed 419</text><rect x="315" y="588" width="210" height="28" rx="8" fill="#ffb454"/><text x="540" y="609" fill="#f7f5ef">7, frozen gate was 8</text>
  </g>
  <line x1="555" y1="345" x2="555" y2="630" stroke="#ff7a90" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="570" y="365" fill="#ff9aad" font-family="Inter,Arial,sans-serif" font-size="15">Phi minimum: 8</text>
  <text x="70" y="655" fill="#a8b3cf" font-family="Inter,Arial,sans-serif" font-size="16">All Phi seeds: 0 shortcuts, 0 paired damage, protected minimum 23/24, selected support beat 99/99 matched random supports.</text>
</svg>
